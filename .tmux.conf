set -g default-command "${SHELL}"

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Alt + \ to split vertically, Alt + - to split horizontally
bind-key -n M-\\ split-window -h -c "#{pane_current_path}"
bind-key -n "M--" split-window -v -c "#{pane_current_path}"

# Hold Alt and use Vim keys to hop between screen splits instantly
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Check if the current pane is running Neovim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"

# Smart Alt + w closing behavior
bind-key -n M-w if-shell "$is_vim" \
    "send-keys Escape ':q' Enter" \
    "kill-pane"

# Hold Alt and press a number to jump directly to that window/tab
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5

# Create a new window using Alt + c
bind-key -n M-c new-window

# Alt + ] to cycle forward
bind-key -n M-] next-window

# Alt + [ to cycle backward
bind-key -n M-[ previous-window

set -g mouse on
set-option -g allow-rename off
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g default-terminal "tmux-256color"
set -sg escape-time 0
# Enable focus events so Neovim tracks pane switching
set -g focus-events on

# Tell tmux that Kitty handles RGB colors and cursor shape sequences
set -as terminal-features ",xterm-kitty:RGB:ccmd@"
set -as terminal-overrides ',xterm-kitty:Ss=\E[%p1%d q:Se=\E[2 q'

# Start with the status bar hidden
set -g status off

# Toggle status bar visibility with Alt + p
bind-key -n M-p set status

# Status Bar
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left "[#S] "
set -g status-right "%d-%m-%Y %H:%M "

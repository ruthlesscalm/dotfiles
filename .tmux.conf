set -g default-command "${SHELL}"
# =============================================
# THE PREFIX (Keep it simple as a backup)
# =============================================
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# =============================================
# DIRECT SPLITTING 
# =============================================
# Alt + \ to split vertically, Alt + - to split horizontally
bind-key -n M-\\ split-window -h -c "#{pane_current_path}"
bind-key -n "M--" split-window -v -c "#{pane_current_path}"

# =============================================
# DIRECT PANE NAVIGATION 
# =============================================
# Hold Ctrl and use Vim keys to hop between screen splits instantly
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
# Close the current pane instantly with Alt + w
bind-key -n M-w kill-pane

# =============================================
# DIRECT WINDOW SWITCHING 
# =============================================
# Hold Alt and press a number to jump directly to that window/tab
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5

# Create a new window using Alt + c
bind-key -n M-c new-window

# =============================================
# SETTINGS & OPTIMIZATIONS
# =============================================
set -g mouse on
set-option -g allow-rename off
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g default-terminal "tmux-256color"
set -sg escape-time 10
# Enable focus events so Neovim tracks pane switching
set -g focus-events on

# Tell tmux that Kitty handles RGB colors and cursor shape sequences
set -as terminal-features ",xterm-kitty:RGB:ccmd@"
set -as terminal-overrides ',xterm-kitty:Ss=\E[%p1%d q:Se=\E[2 q'

# Start with the status bar hidden
set -g status off

# Toggle status bar visibility with Alt + p
bind-key -n M-p set status

# Status Bar
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left "[#S] "
set -g status-right "%Y-%m-%d %H:%M "

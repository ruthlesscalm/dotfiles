# General & Shell
set -g default-command "${SHELL}"
set -g default-terminal "tmux-256color"
set -g mouse on
set -sg escape-time 0
set -g focus-events on
set -g allow-passthrough on

# Extended Keys & Kitty Terminal Support
set -s extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features ",xterm-kitty:RGB,xterm-kitty:extkeys,xterm*:extkeys"

# Prefix: Alt + ;
unbind C-b
set -g prefix "M-;"
bind "M-;" send-prefix

# Window & Pane Indexing
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off

# Pane Navigation (Alt + Vim keys, no prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Window Navigation & Creation (No prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-] next-window
bind -n M-[ previous-window

# Split Bindings
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n "M--" split-window -v -c "#{pane_current_path}"

# Status Bar (Hidden by default; toggle with Alt + p)
set -g status off
bind -n M-p set status
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left "[#S] "
set -g status-right "%d-%m-%Y %H:%M "

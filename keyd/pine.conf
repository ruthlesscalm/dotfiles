[ids]
*

[main]
capslock = layer(numbers)
rightalt = leftcontrol
escape = clearm(esc)

# Top row
# q = q
w = l
e = c
r = m
t = k
y = '
u = f
i = u
# o = o
p = y

# Home row
a = n
s = r
d = s
f = t
g = w
h = p
j = h
k = e
l = a
; = i
' = /

# Bottom row
# z = j // switching z and j
# x = x
# c = z // switching z and j
c = j
v = g
b = v
n = b
m = d
, = ;
. = ,
/ = .

[numbers]
; = oneshot(shift)
w = 1
e = 2
r = 3
t = 4
s = 5
d = 6
f = 7
g = 8
c = 9
v = 0
n = -
m = =
p = \
[ = `
b = toggle(shift)
x = oneshot(control)

i = backspace
o = delete
space = escape

h = left
j = down
k = up
l = right

y = home
u = end
